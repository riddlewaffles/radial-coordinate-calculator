<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Coordinate Calculator</title>
    <link rel="stylesheet" href="rcc.css">
</head>
<body>
    <div class="container">
        <h1>Radial Coordinate Calculator</h1>
    
        <div class="input-group">
            <label for="radius">Radius (r):</label>
            <input type="number" id="radius" value="10" step="any">
        </div>

        <div class="input-group">
            <label for="points">Number of Points (d):</label>
            <input type="number" id="points" value="9" min="1" step="1">
        </div>

        <button id="calc-btn">Calculate Coordinates</button>

        <div class="output-container">
            <h2>Results</h2>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Point</th>
                        <th>Angle</th>
                        <th>(X, Y) Coordinates</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </div>
    </div>

    <div id="footer">
        //  Radial Coordinate Calculator (RCC)
        <br>
        //  Created by: @riddlewaffles
        <br>
        //  GitHub: <a href="https://github.com/riddlewaffles" target="_blank">https://github.com/riddlewaffles</a>
    </div>

    <script src="rcc.js"></script>
</body>
</html>
